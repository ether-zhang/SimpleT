[package]
name = "simplet-native"
version = "2.0.0"
edition = "2021"
publish = false

[[test]]
name = "edit_menu"
path = "tests/edit_menu.rs"
# AppKit must run on the process main thread, not a libtest worker thread.
harness = false

[dependencies]
simplet-core = { path = "../crates/simplet-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["block2"] }
objc2-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColor", "CGPath", "CGContext"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAAnimation", "CALayer", "CAGradientLayer", "CAMediaTiming", "CAMediaTimingFunction", "CATransaction", "objc2-core-graphics", "objc2-core-foundation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
