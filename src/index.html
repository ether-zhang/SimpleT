<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleT</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="card">
    <button id="close-flyout" class="close-flyout" type="button" title="收起窗口" aria-label="收起窗口">×</button>
    <!-- 翻译页 -->
    <main id="page-translate" class="page">
      <div class="langbar">
        <div id="lang-a-picker" class="language-picker">
          <button id="lang-a" class="lang-select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-a-menu" value="Chinese">
            <span id="lang-a-label" class="language-label"></span>
          </button>
          <div id="lang-a-menu" class="language-menu" role="listbox" hidden></div>
        </div>
        <button id="swap" class="swap" title="交换语言">⇄</button>
        <div id="lang-b-picker" class="language-picker">
          <button id="lang-b" class="lang-select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-b-menu" value="English">
            <span id="lang-b-label" class="language-label"></span>
          </button>
          <div id="lang-b-menu" class="language-menu" role="listbox" hidden></div>
        </div>
      </div>

      <div class="panes">
        <textarea id="input" class="pane" placeholder="输入要翻译的内容…" spellcheck="false"></textarea>
        <div class="middle">
          <div class="quick-actions">
            <div class="pane-actions">
              <button id="paste-input" class="icon-button" type="button" title="追加粘贴" aria-label="追加粘贴" aria-controls="input">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h7M16 5h2a2 2 0 0 1 2 2v6M19 16v6m-3-3h6"/></svg>
              </button>
              <button id="clear-input" class="icon-button" type="button" title="清除输入" aria-label="清除输入" aria-controls="input" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14M10 10v6m4-6v6"/></svg>
              </button>
            </div>
            <div class="pane-actions">
              <button id="copy-output" class="icon-button" type="button" title="复制结果" aria-label="复制结果" aria-controls="output" disabled>
                <svg class="copy-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M15 9V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h4"/></svg>
                <svg class="copy-success" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
              </button>
              <button id="clear-output" class="icon-button" type="button" title="清除结果" aria-label="清除结果" aria-controls="output" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14M10 10v6m4-6v6"/></svg>
              </button>
            </div>
          </div>
          <button id="translate-btn" class="translate-btn" aria-labelledby="translate-label" aria-describedby="translate-hint">
            <span id="translate-label">翻译</span>
            <span id="translate-hint" class="translate-hint" role="status" aria-live="polite" aria-atomic="true"></span>
          </button>
          <button id="open-settings" class="secondary small">设置</button>
          <button id="open-history" class="icon-button" type="button" title="历史记录" aria-label="历史记录" aria-controls="page-history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v5h5M3 8l2.64-2.36A9 9 0 1 1 3 12M12 7v5l4 2"/></svg>
          </button>
        </div>
        <textarea id="output" class="pane" placeholder="翻译结果" readonly spellcheck="false"></textarea>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <!-- 历史页：旧记录在上，新记录在下，打开时定位到底端。 -->
    <section id="page-history" class="page hidden" aria-labelledby="history-title">
      <header class="page-header">
        <button id="history-back" class="icon-button page-back" type="button" title="返回翻译" aria-label="返回翻译">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        </button>
        <h2 id="history-title">历史记录</h2>
        <span id="history-hint" class="history-hint">向上查看更早记录</span>
      </header>
      <div id="history-notice" class="history-notice hidden" role="status" aria-live="polite">
        <span id="history-status"></span>
        <button id="history-retry" class="history-link hidden" type="button">重试</button>
      </div>
      <div id="history-scroll" class="history-scroll" tabindex="0" role="region" aria-label="历史记录">
        <button id="history-more" class="history-link history-more hidden" type="button">加载更早记录</button>
        <div id="history-list" class="history-list" role="list"></div>
        <div id="history-empty" class="history-empty" role="status"></div>
      </div>
    </section>

    <!-- 设置页 -->
    <section id="page-settings" class="page hidden" aria-labelledby="settings-title">
      <header class="page-header">
        <button id="cfg-back" class="icon-button page-back" type="button" title="返回翻译" aria-label="返回翻译">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
        </button>
        <h2 id="settings-title">设置</h2>
      </header>
      <div class="settings-field">
        <label id="lbl-url" for="cfg-url">模型 URL（OpenAI 格式，以 /v1 结尾）</label>
        <input id="cfg-url" type="url" placeholder="https://api.openai.com/v1" aria-describedby="cfg-model-status" />
        <div class="connection-feedback">
          <span id="cfg-model-status" role="status" aria-live="polite"></span>
          <button id="cfg-model-retry" class="history-link" type="button" hidden>重试</button>
        </div>
      </div>
      <label>
        <span id="lbl-key">API Key</span>
        <div class="key-row">
          <input id="cfg-key" type="password" placeholder="sk-…" />
          <button id="cfg-key-clear" class="secondary small" type="button">清除</button>
        </div>
      </label>
      <div class="settings-field">
        <label id="lbl-model" for="cfg-model">模型名称</label>
        <div id="cfg-model-picker" class="language-picker model-picker">
          <button id="cfg-model" class="lang-select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="cfg-model-options" aria-describedby="cfg-model-status" disabled>
            <span id="cfg-model-label" class="language-label"></span>
          </button>
          <div id="cfg-model-menu" class="language-menu model-menu" hidden>
            <input id="cfg-model-search" class="model-search" type="search" role="combobox" aria-autocomplete="list" aria-controls="cfg-model-options" aria-expanded="false" autocomplete="off" spellcheck="false" />
            <div class="model-columns">
              <div class="model-column model-provider-column">
                <span id="cfg-model-providers-title" class="model-column-title">供应商</span>
                <div id="cfg-model-providers" class="model-providers" role="listbox" aria-labelledby="cfg-model-providers-title" tabindex="0"></div>
              </div>
              <div class="model-column">
                <span id="cfg-model-models-title" class="model-column-title">模型</span>
                <div id="cfg-model-options" class="model-options" role="listbox" aria-labelledby="cfg-model-models-title" tabindex="0"></div>
                <p id="cfg-model-empty" class="model-empty" role="status" aria-live="polite" hidden></p>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="settings-field">
        <span id="lbl-uilang">界面语言</span>
        <div id="cfg-ui-lang-picker" class="language-picker menu-up">
          <button id="cfg-ui-lang" class="lang-select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="cfg-ui-lang-menu" value="zh">
            <span id="cfg-ui-lang-label" class="language-label"></span>
          </button>
          <div id="cfg-ui-lang-menu" class="language-menu" role="listbox" hidden></div>
        </div>
      </div>
      <div class="settings-field">
        <span id="lbl-appearance">外观</span>
        <div id="cfg-appearance-picker" class="language-picker menu-up">
          <button id="cfg-appearance" class="lang-select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="cfg-appearance-menu" value="default">
            <span id="cfg-appearance-label" class="language-label"></span>
          </button>
          <div id="cfg-appearance-menu" class="language-menu" role="listbox" hidden></div>
        </div>
      </div>
      <div class="settings-actions">
        <button id="cfg-save" class="translate-btn">保存</button>
        <div id="cfg-status" class="status" role="status" aria-live="polite"></div>
      </div>
    </section>
    </div>
  </body>
</html>
