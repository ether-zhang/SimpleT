<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimpleT</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="card">
    <button id="close-flyout" class="close-flyout" type="button" title="收起窗口" aria-label="收起窗口">×</button>
    <!-- 翻译页 -->
    <main id="page-translate" class="page">
      <div class="langbar">
        <div id="lang-a-picker" class="language-picker">
          <button id="lang-a" class="lang-select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-a-menu" value="Chinese">
            <span id="lang-a-label" class="language-label"></span>
          </button>
          <div id="lang-a-menu" class="language-menu" role="listbox" hidden></div>
        </div>
        <button id="swap" class="swap" title="交换语言">⇄</button>
        <div id="lang-b-picker" class="language-picker">
          <button id="lang-b" class="lang-select" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-b-menu" value="English">
            <span id="lang-b-label" class="language-label"></span>
          </button>
          <div id="lang-b-menu" class="language-menu" role="listbox" hidden></div>
        </div>
      </div>

      <div class="panes">
        <textarea id="input" class="pane" placeholder="输入要翻译的内容…" spellcheck="false"></textarea>
        <div class="middle">
          <button id="translate-btn" class="translate-btn" aria-labelledby="translate-label" aria-describedby="translate-hint">
            <span id="translate-label">翻译</span>
            <span id="translate-hint" class="translate-hint" role="status" aria-live="polite" aria-atomic="true"></span>
          </button>
          <button id="open-settings" class="secondary small">设置</button>
        </div>
        <textarea id="output" class="pane" placeholder="翻译结果" readonly spellcheck="false"></textarea>
      </div>

      <div id="status" class="status" role="status" aria-live="polite"></div>
    </main>

    <!-- 设置页 -->
    <section id="page-settings" class="page hidden">
      <h2 id="settings-title">设置</h2>
      <label>
        <span id="lbl-url">模型 URL（OpenAI 格式，以 /v1 结尾）</span>
        <input id="cfg-url" type="text" placeholder="https://api.openai.com/v1" />
      </label>
      <label>
        <span id="lbl-key">API Key</span>
        <div class="key-row">
          <input id="cfg-key" type="password" placeholder="sk-…" />
          <button id="cfg-key-clear" class="secondary small" type="button">清除</button>
        </div>
      </label>
      <label>
        <span id="lbl-model">模型名称</span>
        <input id="cfg-model" type="text" placeholder="gpt-5.5-mini" />
      </label>
      <label>
        <span id="lbl-uilang">界面语言</span>
        <select id="cfg-ui-lang"></select>
      </label>
      <div class="settings-actions">
        <button id="cfg-save" class="translate-btn">保存</button>
        <button id="cfg-back" class="secondary">返回翻译</button>
      </div>
      <div id="cfg-status" class="status"></div>
    </section>
    </div>
  </body>
</html>
